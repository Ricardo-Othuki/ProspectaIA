<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />
    <title>Entrar | ProspectaIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-base: #0f1117;
        --bg-surface: #1a1d2e;
        --bg-elevated: #232740;
        --bg-input: #101522;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --primary: #6366f1;
        --primary-hover: #818cf8;
        --accent: #22d3ee;
        --danger: #f87171;
        --border: rgba(148, 163, 184, 0.18);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 20% 20%, rgba(99,102,241,.16), transparent 62%),
          radial-gradient(ellipse 60% 40% at 80% 80%, rgba(34,211,238,.10), transparent 55%),
          var(--bg-base);
        color: var(--text-primary);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .login-shell { width: min(100%, 420px); }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
      .brand-icon {
        width: 38px; height: 38px; border-radius: 10px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, var(--primary-hover), var(--accent));
        box-shadow: 0 12px 32px rgba(99,102,241,.28);
      }
      .brand h1 { font-size: 1.35rem; margin: 0; letter-spacing: 0; }
      .brand span { color: var(--text-muted); font-size: .82rem; font-weight: 700; }
      .card {
        background: rgba(26, 29, 46, .92);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 20px 70px rgba(0,0,0,.45);
        padding: 28px;
      }
      .card h2 { margin: 0 0 6px; font-size: 1.35rem; }
      .card p { margin: 0 0 22px; color: var(--text-secondary); line-height: 1.5; }
      label { display: grid; gap: 7px; margin-bottom: 14px; color: var(--text-secondary); font-size: .86rem; font-weight: 700; }
      input {
        width: 100%; border: 1px solid var(--border); border-radius: 10px;
        background: var(--bg-input); color: var(--text-primary);
        padding: 12px 13px; font: inherit; outline: none;
      }
      input:focus { border-color: var(--primary-hover); box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
      button {
        width: 100%; margin-top: 6px; border: 0; border-radius: 10px;
        color: white; background: linear-gradient(135deg, var(--primary), #7c3aed);
        padding: 12px 14px; font: inherit; font-weight: 800; cursor: pointer;
        box-shadow: 0 10px 26px rgba(99,102,241,.28);
      }
      button:disabled { opacity: .62; cursor: wait; }
      .error {
        display: none; margin-top: 14px; padding: 10px 12px;
        border-radius: 10px; border: 1px solid rgba(248,113,113,.28);
        color: #fecaca; background: rgba(239,68,68,.13); font-size: .86rem;
      }
      .footer { margin-top: 18px; color: var(--text-muted); font-size: .78rem; text-align: center; }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">↗</div>
        <div>
          <h1>ProspectaIA</h1>
          <span>Painel protegido</span>
        </div>
      </div>
      <section class="card">
        <h2>Entrar no painel</h2>
        <p>Use o usuário criado no Supabase para acessar campanhas, radar e conversas.</p>
        <form id="loginForm">
          <label>E-mail<input id="email" name="email" type="email" autocomplete="email" required /></label>
          <label>Senha<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
          <button id="submitBtn" type="submit">Entrar</button>
          <div id="error" class="error"></div>
        </form>
      </section>
      <div class="footer">Sessão segura via Supabase Auth</div>
    </main>
    <script>
      const form = document.getElementById('loginForm');
      const button = document.getElementById('submitBtn');
      const errorBox = document.getElementById('error');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        errorBox.style.display = 'none';
        button.disabled = true;
        button.textContent = 'Entrando...';
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: form.email.value.trim(),
              password: form.password.value
            })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || 'Não foi possível entrar.');
          window.location.href = '/';
        } catch (error) {
          errorBox.textContent = error.message;
          errorBox.style.display = 'block';
        } finally {
          button.disabled = false;
          button.textContent = 'Entrar';
        }
      });
    </script>
  </body>
</html>
